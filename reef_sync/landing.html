<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-premium { background: rgba(8, 15, 30, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(6, 182, 212, 0.15); }
        ::-webkit-scrollbar { display: none; }
        @keyframes pulse-slow { 0%, 100% { opacity: 0.2; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.15); } }
        .bg-glow { animation: pulse-slow 8s infinite ease-in-out; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 p-6 flex flex-col justify-between min-h-screen overflow-y-auto selection:bg-transparent">
    <div class="absolute top-1/4 -left-10 w-72 h-72 bg-cyan-500/10 rounded-full blur-[90px] bg-glow"></div>
    <div class="absolute bottom-1/4 -right-10 w-72 h-72 bg-rose-500/10 rounded-full blur-[90px] bg-glow" style="animation-delay: 4s"></div>
    
    <div class="flex justify-end pt-2 relative z-10 w-full shrink-0">
        <span class="text-[9px] font-mono tracking-widest text-slate-500 bg-slate-900 px-2.5 py-1 rounded-full border border-slate-800">Node Cluster: UPM</span>
    </div>

    <div class="w-full space-y-6 relative z-10 text-center flex flex-col items-center justify-center my-auto py-4">
        <div class="flex items-center justify-center gap-6 max-w-xs mx-auto">
            <img src="./image_0c1261.png" alt="UPM" class="w-20 h-20 object-contain">
            <img src="./image_0c0ee2.png" alt="RHB" class="w-20 h-20 object-contain">
        </div>

        <div class="inline-flex items-center gap-2 bg-cyan-500/10 px-4 py-1.5 rounded-full border border-cyan-500/20">
            <span class="w-1.5 h-1.5 bg-cyan-400 rounded-full animate-ping"></span>
            <span class="text-[10px] font-bold tracking-widest uppercase text-cyan-400 font-mono">Fintech × Conservation Protocol</span>
        </div>
        
        <div class="space-y-2 px-1">
            <h1 class="text-4xl font-black tracking-tighter text-white">REEF_<span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-teal-400">SYNC</span></h1>
            <p class="text-xs text-slate-400 max-w-xs mx-auto leading-relaxed">A decentralized cognitive ecosystem mapping varsity transactions into live coral preservation.</p>
        </div>

        <div class="glass-premium rounded-2xl p-4 w-full max-w-xs mx-auto shadow-xl">
            <p class="text-[9px] text-cyan-500 font-mono tracking-widest uppercase">Engineered By</p>
            <h2 class="text-sm font-black text-slate-200 mt-0.5">TEAM REEF-STORER</h2>
        </div>
    </div>

    <div class="w-full relative z-10 pb-4 mt-auto shrink-0">
        <button onclick="launchCoreApp()" class="w-full bg-gradient-to-r from-cyan-500 to-teal-500 text-slate-950 font-black text-xs tracking-widest uppercase py-4 rounded-xl active:scale-[0.98] transition cursor-pointer shadow-xl shadow-cyan-500/20">
            Initialize Cluster Connection
        </button>
        <p class="text-[9px] text-center text-slate-600 mt-2.5 font-mono">Authorized for Hackathon Presentation 2026</p>
    </div>

    <script>
        function launchCoreApp() {
            window.parent.postMessage({ type: 'ROUTE_APP', target: 'insights' }, '*');
        }
    </script>
</body>
</html>
