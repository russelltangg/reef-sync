<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>::-webkit-scrollbar { display: none; }</style>
</head>
<body class="bg-slate-950 text-slate-100 p-4 space-y-4 overflow-y-auto selection:bg-transparent">
    <div class="bg-slate-900/40 p-4 rounded-xl border border-slate-900 border-l-4 border-l-amber-500">
        <h2 class="text-[10px] font-bold text-amber-400 uppercase tracking-widest">National Varsity League</h2>
        <p class="text-[11px] text-slate-400 mt-1">Live tracking of Malaysian institutions converting standard spending into active conservation score milestones.</p>
    </div>
    <div class="bg-slate-900/40 rounded-xl p-3 space-y-2 border border-slate-900">
        <div class="flex justify-between items-center p-2.5 bg-gradient-to-r from-cyan-950/40 to-slate-900/40 rounded-lg border border-cyan-500/20">
            <span class="text-xs font-bold text-white">01 Universiti Putra Malaysia (UPM)</span>
            <span class="text-xs font-black text-cyan-400 font-mono">72% + Dynamic</span>
        </div>
        <div class="flex justify-between items-center p-2.5 bg-slate-900/20 text-slate-400 rounded-lg">
            <span class="text-xs">02 Universiti Malaya (UM)</span>
            <span class="text-xs font-bold font-mono">68%</span>
        </div>
    </div>
</body>
</html>
