<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>::-webkit-scrollbar { display: none; }</style>
</head>
<body class="bg-slate-950 text-slate-100 p-4 space-y-4 overflow-y-auto selection:bg-transparent">
    <div class="bg-slate-900/40 p-4 rounded-xl border border-slate-900 border-l-4 border-l-teal-500">
        <h2 class="text-[10px] font-bold text-teal-400 uppercase tracking-widest">MPP Node Registry Portal</h2>
        <p class="text-[11px] text-slate-400 mt-1">Register your university's Student Representative Council to activate campus micro-donation tracking routines.</p>
    </div>
    <form onsubmit="event.preventDefault(); alert('Ecosystem Node Initialized: Verification payload forwarded to campus leadership.')" class="space-y-3 bg-slate-900/20 p-4 rounded-xl border border-slate-900">
        <div>
            <label class="block text-[9px] uppercase font-mono tracking-wider text-slate-400 mb-1">University Name</label>
            <input type="text" placeholder="e.g. Universiti Putra Malaysia" class="w-full bg-slate-950 border border-slate-800 text-xs p-2.5 rounded-lg focus:outline-none text-white" required>
        </div>
        <div>
            <label class="block text-[9px] uppercase font-mono tracking-wider text-slate-400 mb-1">Official MPP Email Contact</label>
            <input type="email" placeholder="mpp@upm.edu.my" class="w-full bg-slate-950 border border-slate-800 text-xs p-2.5 rounded-lg focus:outline-none text-white" required>
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-teal-500 to-cyan-500 text-slate-950 font-bold text-xs tracking-wider uppercase py-3 rounded-lg shadow-lg">
            Register Node Asset
        </button>
    </form>
</body>
</html>
