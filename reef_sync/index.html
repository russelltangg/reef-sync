<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reef_Sync Shell</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        @keyframes pulse-slow { 0%, 100% { opacity: 0.2; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.15); } }
        .bg-glow { animation: pulse-slow 8s infinite ease-in-out; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen w-full flex justify-center items-start" x-data="shellRouter()">

    <div class="w-full max-w-md min-h-screen bg-gradient-to-b from-slate-950 via-slate-900 to-blue-950 relative flex flex-col overflow-hidden shadow-2xl">
        
        <div x-show="showLanding" class="absolute inset-0 z-[100] w-full h-full bg-slate-950 flex flex-col justify-between p-6 overflow-y-auto">
            <div class="absolute top-1/4 -left-10 w-72 h-72 bg-cyan-500/10 rounded-full blur-[90px] bg-glow"></div>
            <div class="absolute bottom-1/4 -right-10 w-72 h-72 bg-rose-500/10 rounded-full blur-[90px] bg-glow" style="animation-delay: 4s"></div>
            
            <div class="flex justify-end pt-2 relative z-10">
                <span class="text-[9px] font-mono tracking-widest text-slate-500 bg-slate-900 px-2.5 py-1 rounded-full border border-slate-800">Node Cluster: UPM</span>
            </div>

            <div class="space-y-6 relative z-10 my-auto text-center flex flex-col items-center">
                <div class="flex items-center justify-center gap-4 mb-2">
                    <img src="./image_0c1261.png" alt="UPM" class="w-20 h-20 object-contain">
                    <img src="./image_0c0ee2.png" alt="RHB" class="w-20 h-20 object-contain">
                </div>
                <div class="inline-flex items-center gap-2 bg-cyan-500/10 px-4 py-1.5 rounded-full border border-cyan-500/20">
                    <span class="w-1.5 h-1.5 bg-cyan-400 rounded-full animate-ping"></span>
                    <span class="text-[10px] font-bold tracking-widest uppercase text-cyan-400 font-mono">Fintech × Conservation</span>
                </div>
                <div class="space-y-2">
                    <h1 class="text-4xl font-black tracking-tighter text-white">REEF_<span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-teal-400">SYNC</span></h1>
                    <p class="text-xs text-slate-400 max-w-xs mx-auto leading-relaxed">A decentralized multi-page cognitive ecosystem mapping varsity transactions into live coral preservation.</p>
                </div>
                <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 w-full max-w-xs shadow-xl">
                    <p class="text-[9px] text-cyan-500 font-mono tracking-widest uppercase">Engineered By</p>
                    <h2 class="text-sm font-black text-slate-200 mt-0.5">TEAM REEF-STORER</h2>
                </div>
            </div>

            <div class="relative z-10 pb-4 mt-auto">
                <button @click="showLanding = false" class="w-full bg-gradient-to-r from-cyan-500 to-teal-500 text-slate-950 font-black text-xs tracking-widest uppercase py-4 rounded-xl active:scale-[0.98] transition cursor-pointer shadow-xl">
                    Initialize Cluster Connection
                </button>
                <p class="text-[9px] text-center text-slate-600 mt-2 font-mono">Authorized for Hackathon Presentation 2026</p>
            </div>
        </div>

        <header class="p-4 flex justify-between items-center border-b border-slate-900 bg-slate-950/90 backdrop-blur-md shrink-0 z-40">
            <div class="flex items-center gap-2.5">
                <div class="flex items-center gap-1.5 bg-slate-900/80 px-2 py-1 rounded-lg border border-slate-800">
                    <img src="./image_0c1261.png" alt="UPM" class="h-5 w-auto object-contain">
                    <img src="./image_0c0ee2.png" alt="RHB" class="h-4 w-auto object-contain">
                </div>
                <div>
                    <h1 class="text-xs font-black tracking-wider bg-gradient-to-r from-cyan-400 to-teal-400 bg-clip-text text-transparent">REEF_SYNC</h1>
                    <p class="text-[9px] text-slate-400">Team: <span class="font-bold text-slate-200">Reef-Storer</span></p>
                </div>
            </div>
            <div class="text-right flex flex-col items-end">
                <div class="px-2 py-0.5 rounded-full text-[9px] font-black bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                    Score: <span x-text="reefScore + '%'"></span>
                </div>
            </div>
        </header>

        <div class="flex-1 w-full bg-slate-950 relative z-10 overflow-hidden">
            <iframe id="viewportFrame" src="./insight-hub.html" class="w-full h-full border-none pointer-events-auto"></iframe>
        </div>

        <nav class="bg-slate-950/95 border-t border-slate-900 px-4 py-3.5 flex justify-around items-center shrink-0 z-40">
            <button @click="changeTab('insights', './insight-hub.html')" class="flex flex-col items-center gap-1 text-[10px] transition cursor-pointer" :class="activeTab === 'insights' ? 'text-cyan-400 font-bold scale-105' : 'text-slate-500'">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span>Insights</span>
            </button>
            <button @click="changeTab('fintech', './fintech-vault.html')" class="flex flex-col items-center gap-1 text-[10px] transition cursor-pointer" :class="activeTab === 'fintech' ? 'text-cyan-400 font-bold scale-105' : 'text-slate-500'">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                <span>RHB Vault</span>
            </button>
        </nav>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            // Secure message listener inside shell wrapper
            window.addEventListener('message', (e) => {
                if (e.data && e.data.type === 'INCREMENT_SCORE') {
                    const router = Alpine.Alpine.data('shellRouter');
                    window.dispatchEvent(new CustomEvent('update-score', { detail: e.data.value }));
                }
            });
        });

        function shellRouter() {
            return {
                showLanding: true,
                activeTab: 'insights',
                reefScore: 72,
                init() {
                    window.addEventListener('update-score', (e) => {
                        if (this.reefScore + e.detail <= 100) {
                            this.reefScore += e.detail;
                        }
                    });
                },
                changeTab(tabName, fileUrl) {
                    this.activeTab = tabName;
                    document.getElementById('viewportFrame').src = fileUrl;
                }
            }
        }
    </script>
</body>
</html>
