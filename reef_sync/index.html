<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reef_Sync Platform v2.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>::-webkit-scrollbar { display: none; }</style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen w-full flex justify-center items-start md:py-6" x-data="shellRouter()">

    <div class="w-full max-w-md min-h-screen md:min-h-[88vh] bg-gradient-to-b from-slate-950 via-slate-900 to-blue-950 relative flex flex-col overflow-hidden shadow-2xl md:rounded-3xl border border-slate-900/50">
        
        <header class="p-4 flex justify-between items-center border-b border-slate-900 bg-slate-950/90 backdrop-blur-md shrink-0 z-40">
            <div class="flex items-center gap-2.5">
                <div class="flex items-center gap-1.5 bg-slate-900/80 px-2 py-1 rounded-lg border border-slate-800">
                    <img src="./image_0c1261.png" alt="UPM" class="h-5 w-auto object-contain">
                    <img src="./image_0c0ee2.png" alt="RHB" class="h-4 w-auto object-contain">
                </div>
                <div>
                    <h1 class="text-xs font-black tracking-wider bg-gradient-to-r from-cyan-400 to-teal-400 bg-clip-text text-transparent">REEF_SYNC</h1>
                    <p class="text-[9px] text-slate-400">Team: <span class="font-bold text-slate-200">Reef-Storer</span></p>
                </div>
            </div>
            <div class="text-right flex flex-col items-end">
                <div class="px-2 py-0.5 rounded-full text-[10px] font-black bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                    Score: <span x-text="reefScore + '%'"></span>
                </div>
            </div>
        </header>

        <div class="flex-1 w-full bg-slate-950 relative z-10 overflow-hidden">
            <iframe id="viewportFrame" src="./landing.html" class="w-full h-full border-none"></iframe>
        </div>

        <nav class="bg-slate-950 border-t border-slate-900 px-1 py-3.5 flex justify-around items-center shrink-0 z-40 md:rounded-b-3xl">
            <button @click="changeTab('insights', './insight-hub.html')" class="flex flex-col items-center gap-1 text-[10px] transition cursor-pointer" :class="activeTab === 'insights' ? 'text-cyan-400 font-bold' : 'text-slate-500'">
                <span>Insights</span>
            </button>
            <button @click="changeTab('fintech', './fintech-vault.html')" class="flex flex-col items-center gap-1 text-[10px] transition cursor-pointer" :class="activeTab === 'fintech' ? 'text-cyan-400 font-bold' : 'text-slate-500'">
                <span>Vault</span>
            </button>
            <button @click="changeTab('leaderboard', './leaderboard.html')" class="flex flex-col items-center gap-1 text-[10px] transition cursor-pointer" :class="activeTab === 'leaderboard' ? 'text-cyan-400 font-bold' : 'text-slate-500'">
                <span>League</span>
            </button>
            <button @click="changeTab('mpp', './mpp-setup.html')" class="flex flex-col items-center gap-1 text-[10px] transition cursor-pointer" :class="activeTab === 'mpp' ? 'text-cyan-400 font-bold' : 'text-slate-500'">
                <span>MPP Setup</span>
            </button>
        </nav>
    </div>

    <script>
        // Catch value payloads coming out of subpages using the system messaging channel
        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'UPDATE_SCORE') {
                window.dispatchEvent(new CustomEvent('sync-score', { detail: e.data.value }));
            }
            if (e.data && e.data.type === 'ROUTE_APP') {
                window.dispatchEvent(new CustomEvent('go-tab', { detail: e.data.target }));
            }
        });

        function shellRouter() {
            return {
                activeTab: 'landing',
                reefScore: 72,
                init() {
                    window.addEventListener('sync-score', (e) => {
                        if (this.reefScore + e.detail <= 100) this.reefScore += e.detail;
                    });
                    window.addEventListener('go-tab', (e) => {
                        this.activeTab = e.detail;
                        document.getElementById('viewportFrame').src = `./insight-hub.html`;
                    });
                },
                changeTab(tabName, fileUrl) {
                    this.activeTab = tabName;
                    document.getElementById('viewportFrame').src = fileUrl;
                }
            }
        }
    </script>
</body>
</html>
