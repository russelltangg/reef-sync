<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reef_Sync Platform v2 - Reef-Storer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="framework.js"></script>
    <style>
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.08); }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased" x-data="globalReefRouter()">

    <div class="max-w-md mx-auto min-h-screen flex flex-col relative bg-gradient-to-b from-slate-900 via-slate-950 to-blue-950 pb-24 shadow-2xl">
        
        <header class="p-4 flex justify-between items-center border-b border-slate-800 sticky top-0 bg-slate-950/95 backdrop-blur-md z-50">
            <div class="flex items-center gap-2.5">
                <div class="flex items-center -space-x-2">
                    <div class="w-8 h-8 bg-white rounded-lg p-1 flex items-center justify-center shadow-md relative z-20">
                        <img src="image_0c1261.png" alt="UPM Logo" class="max-w-full max-h-full object-contain">
                    </div>
                    <div class="w-8 h-8 bg-white rounded-lg p-1 flex items-center justify-center shadow-md relative z-10 border border-slate-100">
                        <img src="image_0c0ee2.png" alt="RHB Logo" class="max-w-full max-h-full object-contain">
                    </div>
                </div>
                
                <div>
                    <div class="flex items-center gap-1.5">
                        <h1 class="text-sm font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-teal-400">REEF_SYNC</h1>
                        <span class="text-[8px] px-1 bg-slate-800 rounded text-slate-400 font-mono">v2.1</span>
                    </div>
                    <p class="text-[9px] text-slate-400 font-medium">Team: <span class="text-slate-200 font-bold">Reef-Storer</span></p>
                </div>
            </div>

            <div class="text-right flex flex-col items-end gap-1">
                <div class="px-2 py-0.5 rounded-full text-[9px] font-bold bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 tracking-wide">
                    Score: <span x-text="$store.appData.reefScore + '%'"></span>
                </div>
                <span class="text-[8px] text-slate-500 font-medium font-mono" x-text="varsityNode"></span>
            </div>
        </header>

        <main class="flex-1 w-full">
            <iframe :src="currentPage" class="w-full h-[calc(100vh-145px)] border-none" id="appViewport"></iframe>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-950/95 border-t border-slate-900 px-4 py-4 flex justify-around items-center z-50">
            <button @click="navigate('insight-hub.html')" class="flex flex-col items-center gap-1 text-xs" :class="activeTab === 'insights' ? 'text-cyan-400 font-bold' : 'text-slate-500'">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span>Insights</span>
            </button>
            
            <button @click="navigate('fintech-vault.html')" class="flex flex-col items-center gap-1 text-xs" :class="activeTab === 'fintech' ? 'text-cyan-400 font-bold' : 'text-slate-500'">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                <span>RHB Vault</span>
            </button>
        </nav>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.store('appData', {
                reefScore: 72,
                totalFunds: 142.80,
                plasticMetric: 340,
                updateState(deltaFunds, deltaPlastic, deltaScore) {
                    this.totalFunds += deltaFunds;
                    this.plasticMetric += deltaPlastic;
                    if(this.reefScore + deltaScore <= 100) this.reefScore += deltaScore;
                }
            });
        });

        function globalReefRouter() {
            return {
                currentPage: 'insight-hub.html',
                activeTab: 'insights',
                varsityNode: 'UPM_NODE.LOCAL',
                navigate(page) {
                    this.currentPage = page;
                    this.activeTab = page.includes('insight') ? 'insights' : 'fintech';
                }
            }
        }
    </script>
</body>
</html>
